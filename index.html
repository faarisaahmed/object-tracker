<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Object Tracker — reframe video by keyframing a subject</title>
<style>
  :root{ --bg:#101017; --panel:#191922; --panel2:#232330; --line:#33333f;
         --txt:#e6e6ef; --dim:#8b8b9e; --acc:#c8607a; --ok:#7fd6a0; --warn:#d8a14a; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);overflow:hidden;
    font:13px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  button,select,input{font:inherit;color:inherit}
  button,select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:5px 10px;cursor:pointer}
  button:hover{background:#2e2e3d;border-color:#4a4a5c}
  button.on{background:var(--acc);border-color:var(--acc);color:#fff}
  button:disabled{opacity:.4;cursor:default}
  #app{display:grid;grid-template-rows:1fr auto auto auto;height:100%}
  #stage{position:relative;min-height:0;display:flex;gap:14px;padding:14px;justify-content:center}
  #wrap{position:relative;min-width:0;touch-action:none;user-select:none}
  #src{display:block;max-width:100%;max-height:100%;cursor:crosshair;
    user-select:none;-webkit-user-drag:none;-webkit-user-select:none}
  #ov{position:absolute;inset:0;pointer-events:none}
  #outwrap{position:relative;flex:none}
  #out{display:block;height:100%;border:1px solid var(--line);border-radius:4px;background:#000}
  .tag{position:absolute;top:6px;left:8px;font-size:11px;color:#ffffff55;pointer-events:none}
  #empty{position:absolute;inset:0;display:grid;place-items:center;background:#101017f2;
    text-align:center;color:var(--dim);z-index:5}
  #empty b{color:var(--txt);font-size:17px}
  #empty p{max-width:420px;margin:8px auto 0;font-size:12.5px;line-height:1.65}

  #tl{background:var(--panel);border-top:1px solid var(--line);padding:10px 14px 4px}
  #track{position:relative;height:84px;background:#12121a;border:1px solid var(--line);
    border-radius:5px;cursor:ew-resize;overflow:hidden;touch-action:none}
  #film{position:absolute;inset:0;width:100%;height:100%}
  #played{position:absolute;top:0;bottom:0;left:0;background:#c8607a14;pointer-events:none}
  #head{position:absolute;top:0;bottom:0;width:2px;background:var(--ok);pointer-events:none;
    box-shadow:0 0 6px #7fd6a0aa}
  .kf{position:absolute;top:0;bottom:0;width:15px;margin-left:-7.5px;cursor:grab;touch-action:none}
  .kf:after{content:'';position:absolute;left:6px;top:0;width:3px;bottom:0;
    background:var(--warn);border-radius:2px;box-shadow:0 0 5px #d8a14a99}
  .kf:before{content:'';position:absolute;left:2.5px;top:-1px;width:10px;height:10px;
    background:var(--warn);border-radius:2px;transform:rotate(45deg)}
  .kf.sel:after,.kf.sel:before{background:#fff}
  #ticks{position:relative;height:16px;color:var(--dim);font-size:10px}
  #ticks span{position:absolute;transform:translateX(-50%)}

  .bar{background:var(--panel);padding:9px 14px;display:flex;gap:10px;align-items:center;
    flex-wrap:wrap;border-top:1px solid #26262f}
  .bar label{color:var(--dim);font-size:11.5px;display:flex;gap:5px;align-items:center}
  input[type=range]{width:96px;accent-color:var(--acc)}
  #info{color:var(--dim);font-size:11.5px;margin-left:auto;font-variant-numeric:tabular-nums}
  #prog{display:none;align-items:center;gap:8px}
  #pbar{width:190px;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
  #pfill{height:100%;width:0;background:var(--acc)}
  #msg{color:var(--warn);font-size:11.5px}
  #trk.on{background:var(--ok);border-color:var(--ok);color:#101017}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="wrap">
      <video id="src" playsinline></video>
      <canvas id="ov"></canvas>
      <div class="tag">drag on the frame to put the crop on your subject</div>
    </div>
    <div id="outwrap"><canvas id="out"></canvas><div class="tag" id="artag"></div></div>
    <div id="empty">
      <div>
        <b>Drop a video here</b>
        <p>Keyframe where the subject is at a few moments; the crop glides between them.
           Nothing is uploaded — the file is read locally by the browser.</p>
      </div>
    </div>
  </div>

  <div id="tl">
    <div id="track"><canvas id="film"></canvas><div id="played"></div><div id="head"></div></div>
    <div id="ticks"></div>
  </div>

  <div class="bar">
    <input type="file" id="file" accept="video/*">
    <button id="play">▶</button>
    <button id="back">−1f</button><button id="fwd">+1f</button>
    <button id="setkf">set keyframe</button>
    <button id="delkf">delete</button>
    <button id="clear">clear all</button>
    <button id="undo" title="undo (ctrl/⌘+z)">↶</button><button id="redo" title="redo (ctrl/⌘+shift+z)">↷</button>
    <button id="trk" title="follow the subject automatically from the current time (t)">auto-track</button>
    <label title="size of the patch the tracker locks onto (dashed square)">target
      <input type="range" id="tsize" min="4" max="60" value="18"></label>
    <span id="msg"></span>
    <span id="info"></span>
  </div>

  <div class="bar">
    <label>aspect <select id="ar">
      <option value="0.5625" selected>9:16 vertical</option>
      <option value="0.8">4:5 portrait</option>
      <option value="1">1:1 square</option>
      <option value="1.7778">16:9 wide</option>
      <option value="2.3333">21:9 cinema</option>
      <option value="custom">custom…</option>
    </select></label>
    <label id="cust" style="display:none">
      <input type="number" id="cw" value="9" min="1" step="any" style="width:56px">
      :
      <input type="number" id="chh" value="16" min="1" step="any" style="width:56px">
    </label>
    <label>zoom <input type="range" id="zoom" min="100" max="300" value="100"><span id="zoomv">1.00×</span></label>
    <label>height <select id="size">
      <option value="1920">1920</option><option value="1280" selected>1280</option>
      <option value="1080">1080</option><option value="native">native</option>
    </select></label>
    <label>motion <select id="interp">
      <option value="spline" selected>smooth</option>
      <option value="ease">ease each</option>
      <option value="linear">linear</option>
    </select></label>
    <label>fps <select id="ofps"><option>60</option><option selected>30</option></select></label>
    <button id="export">export video</button>
    <button id="json">export json</button>
    <button id="imp">import json</button><input type="file" id="impf" accept=".json,application/json" hidden>
    <div id="prog"><div id="pbar"><div id="pfill"></div></div><span id="ptxt"></span></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const vid=$('src'), ov=$('ov'), out=$('out');
let keys=[];                      // {t,x,y} subject centre in source pixels
let sel=-1, W=0, H=0, cw=0, ch=0, dragging=false, SRCNAME='(none)';
let tracking=false, stopTrack=false, tgt=null, pendingTrack=null, thumbs=[];
const say=m=>{ $('msg').textContent=m||''; };

/* ---------- load ---------- */
function load(url,name){ SRCNAME=name||url; keys=[]; thumbs=[];
  vid.src=url; vid.load(); $('empty').style.display='none'; }
$('file').onchange=e=>{ const f=e.target.files[0]; if(f) load(URL.createObjectURL(f),f.name); };
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{ e.preventDefault(); if(tracking) return;
  const fs=[...e.dataTransfer.files];
  const f=fs.find(x=>x.type.startsWith('video/'));
  const j=fs.find(x=>x.name.toLowerCase().endsWith('.json'));
  if(f) load(URL.createObjectURL(f),f.name);
  if(j) readTrack(j); });
vid.addEventListener('error',()=>{ $('empty').style.display='grid'; });
// ?v=path loads a video straight from the server, handy for a fixed workflow
const q=new URLSearchParams(location.search).get('v');
if(q) load(q,q.split('/').pop());

vid.addEventListener('loadedmetadata',()=>{
  W=vid.videoWidth; H=vid.videoHeight; cropSize();
  if(!keys.length) keys=[{t:0,x:W/2,y:H/2}];
  undoStack=[]; redoStack=[];
  if(pendingTrack){ const p=pendingTrack; pendingTrack=null; applyTrack(p); }
  layout(); ticks(); renderKeys(); draw(); buildFilm(vid.currentSrc||vid.src);
});

/* ---------- crop geometry ---------- */
function aspect(){
  if($('ar').value!=='custom') return +$('ar').value;
  const a=+$('cw').value, b=+$('chh').value;
  return (a>0&&b>0) ? a/b : 1;
}
function cropSize(){
  const ar=aspect(), z=+$('zoom').value/100;
  if(ar<=W/H){ ch=H; cw=H*ar; } else { cw=W; ch=W/ar; }   // largest box of this aspect
  cw/=z; ch/=z;
  cw=Math.min(W,Math.round(cw/2)*2); ch=Math.min(H,Math.round(ch/2)*2);
  $('artag').textContent=`${cw}×${ch}`;
}
const clampX=x=>Math.max(cw/2,Math.min(W-cw/2,x));
const clampY=y=>Math.max(ch/2,Math.min(H-ch/2,y));

/* ---------- layout ---------- */
function layout(){
  const stage=$('stage'), avail=stage.clientHeight-28;
  const outH=avail, outW=outH*cw/ch;
  out.style.height=outH+'px'; $('outwrap').style.width=outW+'px';
  out.width=cw; out.height=ch;
  const s=Math.min((stage.clientWidth-outW-42)/W, avail/H);
  vid.style.width=(W*s)+'px'; vid.style.height=(H*s)+'px';
  ov.width=W*s; ov.height=H*s; ov.style.width=ov.width+'px'; ov.style.height=ov.height+'px';
}
addEventListener('resize',()=>{ if(W){layout(); drawFilm(); draw();} });

/* ---------- interpolation ---------- */
// Monotone cubic (Fritsch-Carlson) tangents. The ends are 0 so the crop holds
// still outside the keyed range, and a key where the motion reverses gets 0 too,
// so the crop never overshoots past where you put it. track_to_ffmpeg.py
// computes exactly the same thing.
function tangents(k,a){
  const n=k.length, d=[], m=new Array(n).fill(0);
  for(let i=0;i<n-1;i++) d.push((k[i+1][a]-k[i][a])/Math.max(1e-6,k[i+1].t-k[i].t));
  for(let i=1;i<n-1;i++) if(d[i-1]*d[i]>0) m[i]=(d[i-1]+d[i])/2;
  for(let i=0;i<n-1;i++){
    if(d[i]===0){ m[i]=0; m[i+1]=0; continue; }
    const al=m[i]/d[i], be=m[i+1]/d[i], s=al*al+be*be;
    if(s>9){ const tau=3/Math.sqrt(s); m[i]=tau*al*d[i]; m[i+1]=tau*be*d[i]; }
  }
  return m;
}
function at(t){
  if(!keys.length) return {x:W/2,y:H/2};
  const k=[...keys].sort((a,b)=>a.t-b.t), n=k.length;
  if(t<=k[0].t) return {x:k[0].x,y:k[0].y};
  if(t>=k[n-1].t) return {x:k[n-1].x,y:k[n-1].y};
  let i=0; while(i<n-2&&t>k[i+1].t) i++;
  const h=Math.max(1e-6,k[i+1].t-k[i].t), mode=$('interp').value;
  let u=(t-k[i].t)/h;
  if(mode==='spline'){
    const mx=tangents(k,'x'), my=tangents(k,'y');
    const u2=u*u, u3=u2*u, h00=2*u3-3*u2+1, h10=u3-2*u2+u, h01=-2*u3+3*u2, h11=u3-u2;
    return { x:clampX(h00*k[i].x+h10*h*mx[i]+h01*k[i+1].x+h11*h*mx[i+1]),
             y:clampY(h00*k[i].y+h10*h*my[i]+h01*k[i+1].y+h11*h*my[i+1]) };
  }
  if(mode==='ease') u=u*u*(3-2*u);
  return {x:k[i].x+(k[i+1].x-k[i].x)*u, y:k[i].y+(k[i+1].y-k[i].y)*u};
}

/* ---------- undo ---------- */
let undoStack=[], redoStack=[];
const snap=()=>JSON.stringify(keys);
function pushUndo(){ undoStack.push(snap()); if(undoStack.length>200) undoStack.shift(); redoStack=[]; }
function restore(s){ keys=JSON.parse(s); sel=-1; renderKeys(); drawFilm(); draw(); }
function undo(){ if(tracking||!undoStack.length) return; redoStack.push(snap()); restore(undoStack.pop()); }
function redo(){ if(tracking||!redoStack.length) return; undoStack.push(snap()); restore(redoStack.pop()); }
function setKey(t,x,y){
  const i=keys.findIndex(k=>Math.abs(k.t-t)<0.04);
  if(i>=0){ keys[i].x=x; keys[i].y=y; sel=i; }
  else { keys.push({t,x,y}); keys.sort((a,b)=>a.t-b.t); sel=keys.findIndex(k=>k.t===t); }
  renderKeys(); drawFilm();
}

/* ---------- drag on the frame ---------- */
const wrap=$('wrap');
wrap.addEventListener('dragstart',e=>e.preventDefault());
wrap.addEventListener('pointerdown',e=>{
  if(!W||tracking) return; e.preventDefault(); dragging=true; pushUndo();
  try{ wrap.setPointerCapture(e.pointerId); }catch(_){}
  pick(e); });
wrap.addEventListener('pointermove',e=>{ if(dragging){ e.preventDefault(); pick(e); } });
const endDrag=e=>{ dragging=false; try{ wrap.releasePointerCapture(e.pointerId); }catch(_){} };
wrap.addEventListener('pointerup',endDrag);
wrap.addEventListener('pointercancel',endDrag);
function pick(e){
  const r=vid.getBoundingClientRect();
  setKey(vid.currentTime,
         clampX((e.clientX-r.left)/r.width*W),
         clampY((e.clientY-r.top)/r.height*H));
  draw();
}

/* ---------- draw ---------- */
function draw(){
  if(!W) return;
  const c=ov.getContext('2d'); c.clearRect(0,0,ov.width,ov.height);
  const s=ov.width/W, p=at(vid.currentTime);
  const l=(p.x-cw/2)*s, t=(p.y-ch/2)*s, w=cw*s, h=ch*s;
  c.fillStyle='#000000a8';
  c.fillRect(0,0,ov.width,t); c.fillRect(0,t+h,ov.width,ov.height-t-h);
  c.fillRect(0,t,l,h); c.fillRect(l+w,t,ov.width-l-w,h);
  c.strokeStyle='#7fd6a0'; c.lineWidth=2; c.strokeRect(l+1,t+1,w-2,h-2);
  c.strokeStyle='#c8607a'; c.lineWidth=1.5;
  c.beginPath(); c.moveTo(p.x*s,t); c.lineTo(p.x*s,t+h);
  c.moveTo(l,p.y*s); c.lineTo(l+w,p.y*s); c.stroke();
  // the patch auto-track locks onto: where it is mid-track, the crop centre otherwise
  const g=tgt||p, ts=tgtSide()*s;
  c.setLineDash([5,4]); c.strokeStyle=tracking?'#7fd6a0':'#ffffff66'; c.lineWidth=1.5;
  c.strokeRect(g.x*s-ts/2,g.y*s-ts/2,ts,ts); c.setLineDash([]);
  const o=out.getContext('2d');
  o.fillStyle='#000'; o.fillRect(0,0,cw,ch);
  try{ o.drawImage(vid, p.x-cw/2,p.y-ch/2,cw,ch, 0,0,cw,ch); }catch(_){}
  const d=vid.duration||1;
  $('head').style.left=(vid.currentTime/d*100)+'%';
  $('played').style.width=(vid.currentTime/d*100)+'%';
  $('info').textContent=`${vid.currentTime.toFixed(2)} / ${(vid.duration||0).toFixed(2)}s   `
    +`centre ${Math.round(p.x)},${Math.round(p.y)}   ${keys.length} keyframe${keys.length===1?'':'s'}`;
}
(function loop(){ draw(); requestAnimationFrame(loop); })();

/* ---------- filmstrip + path curve ---------- */

async function buildFilm(url){
  thumbs=[];
  const v=document.createElement('video');
  v.src=url; v.muted=true; v.playsInline=true;
  try{ await new Promise((res,rej)=>{ v.addEventListener('loadedmetadata',res,{once:true});
       v.addEventListener('error',rej,{once:true}); }); }catch(_){ return; }
  const N=Math.min(24,Math.max(8,Math.round(v.duration*1.2)));
  const th=84, tw=Math.round(th*v.videoWidth/v.videoHeight);
  const cv=document.createElement('canvas'); cv.width=tw; cv.height=th;
  const cx=cv.getContext('2d');
  for(let i=0;i<N;i++){
    v.currentTime=v.duration*(i+0.5)/N;
    try{ await new Promise((res,rej)=>{ v.addEventListener('seeked',res,{once:true});
         setTimeout(rej,4000); }); }catch(_){ break; }
    cx.drawImage(v,0,0,tw,th);
    const img=new Image(); img.src=cv.toDataURL('image/jpeg',0.6);
    thumbs.push(img); drawFilm();
  }
  drawFilm();
}
function drawFilm(){
  const cv=$('film'), r=$('track').getBoundingClientRect(), dpr=devicePixelRatio||1;
  if(cv.width!==r.width*dpr||cv.height!==r.height*dpr){ cv.width=r.width*dpr; cv.height=r.height*dpr; }
  const c=cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
  const w=r.width,h=r.height;
  c.clearRect(0,0,w,h); c.fillStyle='#12121a'; c.fillRect(0,0,w,h);
  if(thumbs.length){
    const tw=w/thumbs.length;
    thumbs.forEach((im,i)=>{ if(im.complete&&im.naturalWidth) c.drawImage(im,i*tw,0,tw+1,h); });
    c.fillStyle='#101017aa'; c.fillRect(0,0,w,h);
  }
  if(!W||!vid.duration) return;
  const line=(get,col)=>{ c.strokeStyle=col; c.lineWidth=2; c.beginPath();
    for(let px=0;px<=w;px++){ const v2=get(px/w*vid.duration);
      px?c.lineTo(px,v2):c.moveTo(px,v2); } c.stroke(); };
  if(W-cw>1) line(t=>h-((at(t).x-cw/2)/(W-cw))*(h-14)-7, '#7fd6a0');
  if(H-ch>1) line(t=>h-((at(t).y-ch/2)/(H-ch))*(h-14)-7, '#c8607a');
}

/* ---------- timeline ---------- */
let scrub=false;
const timeAt=e=>{ const r=$('track').getBoundingClientRect();
  return Math.max(0,Math.min(vid.duration||0,(e.clientX-r.left)/r.width*(vid.duration||0))); };
$('track').addEventListener('pointerdown',e=>{
  if(e.target.classList.contains('kf')||!W||tracking) return;
  e.preventDefault(); scrub=true;
  try{ $('track').setPointerCapture(e.pointerId); }catch(_){}
  vid.pause(); $('play').textContent='▶'; vid.currentTime=timeAt(e);
});
$('track').addEventListener('pointermove',e=>{ if(scrub) vid.currentTime=timeAt(e); });
$('track').addEventListener('pointerup',e=>{ scrub=false;
  try{ $('track').releasePointerCapture(e.pointerId); }catch(_){} });

function renderKeys(){
  [...$('track').querySelectorAll('.kf')].forEach(n=>n.remove());
  keys.forEach((k,i)=>{
    const d=document.createElement('div');
    d.className='kf'+(i===sel?' sel':'');
    d.style.left=(k.t/(vid.duration||1)*100)+'%';
    d.title=`${k.t.toFixed(2)}s  ${Math.round(k.x)},${Math.round(k.y)}`;
    d.onpointerdown=ev=>{
      ev.stopPropagation(); ev.preventDefault(); if(tracking) return;
      pushUndo(); sel=i; vid.currentTime=k.t; renderKeys();
      try{ d.setPointerCapture(ev.pointerId); }catch(_){}
      const move=m=>{ k.t=timeAt(m); vid.currentTime=k.t;
        keys.sort((a,b)=>a.t-b.t); sel=keys.indexOf(k); renderKeys(); drawFilm(); };
      const up=u=>{ d.removeEventListener('pointermove',move); d.removeEventListener('pointerup',up); };
      d.addEventListener('pointermove',move); d.addEventListener('pointerup',up);
    };
    $('track').appendChild(d);
  });
}
function ticks(){
  const el=$('ticks'); el.innerHTML='';
  const n=Math.min(12,Math.max(2,Math.ceil(vid.duration)));
  for(let i=0;i<=n;i++){
    const s=document.createElement('span');
    s.style.left=(i/n*100)+'%'; s.textContent=(vid.duration*i/n).toFixed(1)+'s';
    el.appendChild(s);
  }
}

/* ---------- transport ---------- */
$('play').onclick=()=>{ if(!W||tracking) return;
  if(vid.paused){vid.play();$('play').textContent='❚❚';} else {vid.pause();$('play').textContent='▶';} };
vid.addEventListener('ended',()=>$('play').textContent='▶');
const stepF=d=>{ if(!W||tracking) return; vid.pause(); $('play').textContent='▶';
  vid.currentTime=Math.max(0,Math.min(vid.duration,vid.currentTime+d/60)); };
$('back').onclick=()=>stepF(-1); $('fwd').onclick=()=>stepF(1);
$('setkf').onclick=()=>{ if(!W||tracking) return; const p=at(vid.currentTime);
  pushUndo(); setKey(vid.currentTime,p.x,p.y); draw(); };
$('delkf').onclick=()=>{ if(!tracking&&sel>=0&&keys.length>1){ pushUndo(); keys.splice(sel,1); sel=-1;
  renderKeys(); drawFilm(); draw(); } };
$('clear').onclick=()=>{ if(!W||tracking) return; pushUndo();
  keys=[{t:0,x:W/2,y:H/2}]; sel=-1; renderKeys(); drawFilm(); draw(); };
$('undo').onclick=undo; $('redo').onclick=redo;
['ar','zoom','cw','chh'].forEach(id=>$(id).addEventListener('input',()=>{
  $('cust').style.display = $('ar').value==='custom' ? 'flex' : 'none';
  if(!W) return; cropSize();
  $('zoomv').textContent=(+$('zoom').value/100).toFixed(2)+'×';
  keys.forEach(k=>{ k.x=clampX(k.x); k.y=clampY(k.y); });
  layout(); drawFilm(); draw();
}));
$('interp').addEventListener('change',()=>{ drawFilm(); draw(); });
addEventListener('keydown',e=>{
  if(['INPUT','SELECT'].includes(e.target.tagName)) return;
  if(e.key==='Escape'&&tracking){ stopTrack=true; return; }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); return; }
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==='t'){ $('trk').click(); return; }
  if(tracking) return;
  if(e.key===' '){e.preventDefault();$('play').click();}
  if(e.key==='ArrowLeft'){e.preventDefault();stepF(e.shiftKey?-10:-1);}
  if(e.key==='ArrowRight'){e.preventDefault();stepF(e.shiftKey?10:1);}
  if(e.key==='k'){$('setkf').click();}
  if(e.key==='Backspace'||e.key==='Delete'){$('delkf').click();}
});

/* ---------- auto-track ---------- */
// Template matching by normalised cross-correlation on a downscaled grey copy of
// each frame. The patch is the dashed square; it adapts slowly so the tracker
// copes with the subject turning or the light changing, but stops when the best
// match gets too weak instead of wandering off onto the background.
const STEP=1/20;          // seconds between tracked samples
const LOST=0.5;           // NCC below this = lost the subject
const tgtSide=()=>Math.max(8,Math.round(Math.min(W,H)*(+$('tsize').value/100)));
$('tsize').addEventListener('input',draw);

function seekTo(t){ return new Promise(res=>{
  const done=()=>{ clearTimeout(to); res(); };
  const to=setTimeout(()=>{ vid.removeEventListener('seeked',done); res(); },3000);
  vid.addEventListener('seeked',done,{once:true}); vid.currentTime=t; }); }

function grabber(S){
  const gw=Math.max(16,Math.round(W*S)), gh=Math.max(16,Math.round(H*S));
  const cv=document.createElement('canvas'); cv.width=gw; cv.height=gh;
  const cx=cv.getContext('2d',{willReadFrequently:true});
  return {gw,gh,grab(){
    cx.drawImage(vid,0,0,gw,gh);
    const d=cx.getImageData(0,0,gw,gh).data, o=new Float32Array(gw*gh);
    for(let i=0,j=0;j<o.length;i+=4,j++) o[j]=.299*d[i]+.587*d[i+1]+.114*d[i+2];
    return o; }};
}
function cutPatch(f,gw,x0,y0,ts){
  const p=new Float32Array(ts*ts);
  for(let y=0;y<ts;y++){ const r=(y0+y)*gw+x0; for(let x=0;x<ts;x++) p[y*ts+x]=f[r+x]; }
  return p;
}
function stats(p,ts,st){ let a=0,b=0,n=0;
  for(let y=0;y<ts;y+=st) for(let x=0;x<ts;x+=st){ const v=p[y*ts+x]; a+=v; b+=v*v; n++; }
  return {a,n,d:b-a*a/n}; }
function ncc(f,gw,p,ts,x0,y0,st,T){
  let sv=0,sv2=0,svt=0;
  for(let y=0;y<ts;y+=st){ const r=(y0+y)*gw+x0, q=y*ts;
    for(let x=0;x<ts;x+=st){ const v=f[r+x]; sv+=v; sv2+=v*v; svt+=v*p[q+x]; } }
  const dv=sv2-sv*sv/T.n;
  if(dv<1e-3||T.d<1e-3) return 0;
  return (svt-sv*T.a/T.n)/Math.sqrt(dv*T.d);
}
// best top-left within ±R of (bx,by): coarse pass on every 2nd pixel and offset, then refine
function search(f,gw,gh,p,ts,bx,by,R){
  const T2=stats(p,ts,2), T1=stats(p,ts,1);
  let best=-2, mx=bx, my=by;
  for(let dy=-R;dy<=R;dy+=2) for(let dx=-R;dx<=R;dx+=2){
    const x0=bx+dx, y0=by+dy;
    if(x0<0||y0<0||x0+ts>gw||y0+ts>gh) continue;
    const sc=ncc(f,gw,p,ts,x0,y0,2,T2); if(sc>best){ best=sc; mx=x0; my=y0; } }
  const cx=mx, cy=my; best=-2;
  for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++){
    const x0=cx+dx, y0=cy+dy;
    if(x0<0||y0<0||x0+ts>gw||y0+ts>gh) continue;
    const sc=ncc(f,gw,p,ts,x0,y0,1,T1); if(sc>best){ best=sc; mx=x0; my=y0; } }
  return {x:mx,y:my,score:best};
}
// Ramer-Douglas-Peucker on (t,x,y): keep only the samples the path actually bends at
function simplify(pts,tol){
  if(pts.length<3) return pts.slice();
  const keep=new Uint8Array(pts.length); keep[0]=keep[pts.length-1]=1;
  const stack=[[0,pts.length-1]];
  while(stack.length){
    const [a,b]=stack.pop(); let worst=0, wi=-1;
    for(let i=a+1;i<b;i++){
      const u=(pts[i].t-pts[a].t)/Math.max(1e-6,pts[b].t-pts[a].t);
      const ex=pts[a].x+(pts[b].x-pts[a].x)*u-pts[i].x, ey=pts[a].y+(pts[b].y-pts[a].y)*u-pts[i].y;
      const e=Math.hypot(ex,ey); if(e>worst){ worst=e; wi=i; } }
    if(worst>tol){ keep[wi]=1; stack.push([a,wi],[wi,b]); }
  }
  return pts.filter((_,i)=>keep[i]);
}
function smooth(pts,r){
  return pts.map((p,i)=>{ let sx=0,sy=0,n=0;
    for(let j=Math.max(0,i-r);j<=Math.min(pts.length-1,i+r);j++){ sx+=pts[j].x; sy+=pts[j].y; n++; }
    return {t:p.t,x:sx/n,y:sy/n}; });
}

$('trk').onclick=async()=>{
  if(!W) return;
  if(tracking){ stopTrack=true; return; }
  tracking=true; stopTrack=false; vid.pause(); $('play').textContent='▶';
  $('trk').classList.add('on'); $('trk').textContent='stop (esc)';
  pushUndo();
  const S=Math.min(1,360/Math.min(W,H)), G=grabber(S);
  const t0=vid.currentTime, start=at(t0);
  const before=keys.filter(k=>k.t<t0-0.04), oldKeys=keys.map(k=>({...k}));
  const ts=Math.max(8,Math.round(tgtSide()*S)), R=Math.max(10,Math.round(ts*0.6));
  await seekTo(t0);
  let f=G.grab();
  // the patch has to sit inside the frame; remember how far the subject is from its centre
  let bx=Math.max(0,Math.min(G.gw-ts,Math.round(start.x*S-ts/2)));
  let by=Math.max(0,Math.min(G.gh-ts,Math.round(start.y*S-ts/2)));
  const offX=start.x-(bx+ts/2)/S, offY=start.y-(by+ts/2)/S;
  let tpl=cutPatch(f,G.gw,bx,by,ts);
  const samples=[{t:t0,x:start.x,y:start.y}];
  let why='';
  if(stats(tpl,ts,1).d/(ts*ts)<4) why='the dashed square has no detail to lock onto — move it onto the subject or make it bigger';
  for(let t=t0+STEP; !why && !stopTrack && t<vid.duration-1e-3; t+=STEP){
    await seekTo(t); f=G.grab();
    const m=search(f,G.gw,G.gh,tpl,ts,bx,by,R);
    if(m.score<LOST){ why=`lost the subject at ${t.toFixed(2)}s — set a keyframe there and track again`; break; }
    bx=m.x; by=m.y;
    if(m.score>0.8){ const np=cutPatch(f,G.gw,bx,by,ts); for(let i=0;i<tpl.length;i++) tpl[i]=tpl[i]*0.92+np[i]*0.08; }
    const sx=(bx+ts/2)/S+offX, sy=(by+ts/2)/S+offY;
    tgt={x:sx,y:sy};
    samples.push({t,x:clampX(sx),y:clampY(sy)});
    keys=before.concat(samples); sel=-1;
    if(samples.length%4===0){ renderKeys(); drawFilm(); }
    say(`tracking ${t.toFixed(2)}s  match ${(m.score*100).toFixed(0)}%`);
  }
  // keep everything outside the tracked range; replace what was inside with a light set of keys
  const tEnd=samples[samples.length-1].t;
  const after=oldKeys.filter(k=>k.t>tEnd+0.04);
  const tol=Math.max(2,Math.min(W,H)*0.006);
  const simp=simplify(smooth(samples,2),tol).map(k=>({t:k.t,x:clampX(k.x),y:clampY(k.y)}));
  simp[0]={t:t0,x:start.x,y:start.y};
  keys=before.concat(simp,after); sel=-1; tgt=null;
  tracking=false; $('trk').classList.remove('on'); $('trk').textContent='auto-track';
  renderKeys(); drawFilm(); draw();
  if(samples.length>1){
    if($('interp').value==='ease') $('interp').value='spline';
    say((why||(stopTrack?'stopped':'tracked to the end'))+`  ·  ${simp.length} keyframes over ${(tEnd-t0).toFixed(1)}s  (ctrl+z to undo)`);
  } else { undoStack.pop(); say(why||'nothing to track from here'); }
};

/* ---------- import json ---------- */
function readTrack(file){
  file.text().then(t=>applyTrack(JSON.parse(t))).catch(e=>say('could not read '+file.name+': '+e.message));
}
$('imp').onclick=()=>{ if(!tracking) $('impf').click(); };
$('impf').onchange=e=>{ const f=e.target.files[0]; if(f) readTrack(f); e.target.value=''; };
function applyTrack(tr){
  if(!tr||!Array.isArray(tr.keys)||!tr.keys.length) return say('that json has no keyframes');
  if(!W){ pendingTrack=tr; return say('track loaded — now drop the video it belongs to'); }
  pushUndo();
  // coordinates are source pixels: rescale if this video is a different size (e.g. a proxy)
  const sx=W/(+tr.width||W), sy=H/(+tr.height||H);
  if(tr.aspect>0){
    const opt=[...$('ar').options].find(o=>o.value!=='custom'&&Math.abs(+o.value-tr.aspect)<0.002);
    if(opt) $('ar').value=opt.value;
    else { $('ar').value='custom'; $('cw').value=+tr.aspect.toFixed(4); $('chh').value=1; }
    $('cust').style.display=$('ar').value==='custom'?'flex':'none';
  }
  if(tr.zoom>0){ $('zoom').value=Math.round(Math.min(3,Math.max(1,tr.zoom))*100);
    $('zoomv').textContent=(+$('zoom').value/100).toFixed(2)+'×'; }
  $('interp').value=['spline','ease','linear'].includes(tr.interp)?tr.interp:(tr.ease===false?'linear':'ease');
  cropSize();
  keys=tr.keys.map(k=>({t:+k.t,x:clampX(k.x*sx),y:clampY(k.y*sy)})).sort((a,b)=>a.t-b.t);
  sel=-1; layout(); renderKeys(); drawFilm(); draw();
  say(`imported ${keys.length} keyframes`+(sx!==1||sy!==1?` (rescaled from ${tr.width}×${tr.height})`:''));
}

/* ---------- export ---------- */
$('json').onclick=()=>{
  const b=new Blob([JSON.stringify({source:SRCNAME,width:W,height:H,
    crop:{w:cw,h:ch},aspect:aspect(),zoom:+$('zoom').value/100,
    interp:$('interp').value, ease:$('interp').value!=='linear',
    keys:keys.map(k=>({t:+k.t.toFixed(3),x:Math.round(k.x),y:Math.round(k.y)}))},null,1)],
    {type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download='track.json'; a.click();
};

$('export').onclick=async()=>{
  if(!W||tracking) return;
  const btn=$('export'); btn.disabled=true;
  const oh=$('size').value==='native'?ch:+$('size').value;
  const ow=Math.round(oh*cw/ch/2)*2;
  const fps=+$('ofps').value;
  const cv=document.createElement('canvas'); cv.width=ow; cv.height=Math.round(oh/2)*2;
  const cx=cv.getContext('2d');
  const stream=cv.captureStream(fps);
  try{ const as=vid.captureStream?vid.captureStream():vid.mozCaptureStream();
       as.getAudioTracks().forEach(t=>stream.addTrack(t)); }catch(_){}
  const types=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4',
               'video/webm;codecs=vp9,opus','video/webm'];
  const mime=types.find(t=>MediaRecorder.isTypeSupported(t))||'';
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:12e6});
  const chunks=[]; rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  const stopped=new Promise(r=>rec.onstop=r);

  $('prog').style.display='flex';
  vid.pause(); vid.currentTime=0;
  await new Promise(r=>vid.addEventListener('seeked',r,{once:true}));
  rec.start(); await vid.play();
  const t0=performance.now();
  (function pump(){
    if(vid.ended||vid.paused) return;
    const p=at(vid.currentTime);
    cx.fillStyle='#000'; cx.fillRect(0,0,cv.width,cv.height);
    cx.drawImage(vid, p.x-cw/2,p.y-ch/2,cw,ch, 0,0,cv.width,cv.height);
    const f=vid.currentTime/vid.duration;
    $('pfill').style.width=(f*100)+'%';
    $('ptxt').textContent=`recording ${(f*100).toFixed(0)}%  ${((performance.now()-t0)/1000).toFixed(0)}s`;
    requestAnimationFrame(pump);
  })();
  await new Promise(r=>vid.addEventListener('ended',r,{once:true}));
  rec.stop(); await stopped;
  const ext=mime.includes('mp4')?'mp4':'webm';
  const blob=new Blob(chunks,{type:mime});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='tracked.'+ext; a.click();
  $('ptxt').textContent=`saved ${(blob.size/1e6).toFixed(1)}MB as .${ext}`;
  btn.disabled=false;
};
</script>
